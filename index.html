<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%232E4036'/><circle cx='50' cy='50' r='20' fill='%23CC5833'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LivrExpress — Pulsation Logistique Urbaine en 2 Heures</title>
    <meta name="description" content="LivrExpress synchronise la livraison de colis urbains en moins de 120 minutes. Une précision clinique alliant vitesse d'exécution, télémétrie zéro compromis et fluidité absolue." />
    
    <!-- Google Fonts for Preset A: Plus Jakarta Sans, Outfit, Cormorant Garamond, IBM Plex Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400;1,600;1,700&family=IBM+Plex+Mono:wght@400;500;600&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-creme text-charbon selection:bg-argile selection:text-white antialiased overflow-x-hidden">
    <!-- Overlay de Bruit SVG Global (0.05 d'opacité) -->
    <div class="fixed inset-0 pointer-events-none z-[999] opacity-[0.05] mix-blend-overlay">
      <svg class="w-full h-full" xmlns="http://www.w3.org/2000/svg">
        <filter id="noiseFilter">
          <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch" />
        </filter>
        <rect width="100%" height="100%" filter="url(#noiseFilter)" />
      </svg>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
